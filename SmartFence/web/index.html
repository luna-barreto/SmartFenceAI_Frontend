<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>SmartFence AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Sora:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      html, body { height: 100%; margin: 0; padding: 0; background: #173B1A; }

      /* ── Tipografía global ── */
      body, body * {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      /* Sora para títulos y valores destacados (bold) */
      [style*="font-weight: 600"],
      [style*="font-weight: 700"],
      [style*="font-weight: 800"],
      [style*="font-weight: 900"] {
        font-family: 'Sora', sans-serif !important;
      }
      #root { display: flex; height: 100%; flex: 1; }

      #sf-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #173B1A;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #sf-splash.fade-out { opacity: 0; pointer-events: none; }

      .sf-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255,255,255,0.15);
        border-top-color: #7FB05A;
        border-radius: 50%;
        animation: sf-spin 0.8s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes sf-spin { to { transform: rotate(360deg); } }

      .sf-label {
        color: #A8CB88;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
        letter-spacing: 0.5px;
      }

      /* reset react-native-web */
      body { overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="sf-splash">
      <div class="sf-spinner"></div>
      <span class="sf-label">SmartFence AI</span>
    </div>

    <div id="root"></div>

    <script>
      // Ocultar el splash nativo una vez que React renderiza algo en #root
      var _sfObserver = new MutationObserver(function() {
        var root = document.getElementById('root');
        if (root && root.children.length > 0) {
          var splash = document.getElementById('sf-splash');
          if (splash) {
            splash.classList.add('fade-out');
            setTimeout(function() { splash.remove(); }, 450);
          }
          _sfObserver.disconnect();
        }
      });
      _sfObserver.observe(document.getElementById('root'), { childList: true });
    </script>
  </body>
</html>
